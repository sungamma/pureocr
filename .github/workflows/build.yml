name: build

# 触发方式：
#   - push 到 main / 打 tag（v*）→ 编译 + 打包 zip（tag 额外发 Release）
#   - pull request    → 只验证能编译
#   - 手动（workflow_dispatch）→ 可选模型与是否发 Release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      models:
        description: '打包时附带哪些模型（none = 只带字典，首次运行时在线下载）'
        type: choice
        options: [none, basic, full]
        default: none
      publish_release:
        description: '上传到 GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ORT_VERSION: '1.20.1'
  MUPDF_VERSION: '1.25.0'
  PROJECT_DIR: ocr-gui

defaults:
  run:
    working-directory: ocr-gui

jobs:
  # ------------------------------------------------------------------
  # Windows x64：当前唯一完整支持的平台，产物即发布包
  # ------------------------------------------------------------------
  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 ONNX Runtime
        uses: actions/cache@v4
        with:
          path: third_party/onnxruntime-win-x64-${{ env.ORT_VERSION }}
          key: ort-win-x64-${{ env.ORT_VERSION }}

      - name: 缓存 MuPDF（含 slim 库，523 MB，重建要十几分钟）
        uses: actions/cache@v4
        with:
          path: third_party/mupdf-${{ env.MUPDF_VERSION }}
          key: mupdf-win-x64-${{ env.MUPDF_VERSION }}-slim-v1

      - name: 下载依赖（已存在则跳过）
        shell: pwsh
        run: pwsh -NoProfile -File tools/fetch_deps.ps1

      - name: 下载模型（可选）
        if: ${{ inputs.models != 'none' && inputs.models != '' }}
        shell: pwsh
        run: python tools/fetch_models.py

      - name: 编译 + 打包
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            'ci-' + $env:GITHUB_RUN_NUMBER
          }
          $models = if ($env:INPUT_MODELS) { $env:INPUT_MODELS } else { 'none' }
          Write-Host "版本=$ver 模型=$models"
          pwsh -NoProfile -File tools/release.ps1 -Clean -Version $ver -Models $models
        env:
          INPUT_MODELS: ${{ inputs.models }}

      - name: 汇总产物
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.zip | ForEach-Object { $_.Name + '  ' + [math]::Round($_.Length / 1MB, 1) + ' MB' }
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ocrgui-windows-x64
          path: |
            ocr-gui/dist/*.zip
            ocr-gui/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/', '' } else { 'ci-' + $env:GITHUB_RUN_NUMBER }
          $zip = Get-ChildItem dist -Filter *.zip | Select-Object -First 1
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --notes "自动构建 $tag" }
          gh release upload $tag $zip.FullName dist/SHA256SUMS.txt --clobber

  # ------------------------------------------------------------------
  # Linux / macOS：目前代码里 WinHTTP、Win32 文件对话框、字体枚举、
  # .rc 图标都是 Windows 专有，这里只做“能不能配置/编译”的探测，失败不拦 CI。
  # 移植清单见 docs/CROSS_PLATFORM.md，移植完成后把 continue-on-error 去掉即可。
  # ------------------------------------------------------------------
  unix-probe:
    name: ${{ matrix.os }}（实验性：尚未移植）
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libfontconfig1-dev libgl1-mesa-dev xorg-dev

      - name: CMake 配置
        continue-on-error: true
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        continue-on-error: true
        run: cmake --build build --parallel 4

      - name: 说明
        run: |
          echo "::warning file=${{ env.PROJECT_DIR }}/docs/CROSS_PLATFORM.md::当前代码仅支持 Windows，Linux/macOS 需要先完成移植（见 docs/CROSS_PLATFORM.md）"
